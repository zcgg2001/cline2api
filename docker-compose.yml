services:
  cline-proxy:
    build: .
    container_name: cline-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3457:3457"
    volumes:
      - ./data:/app/data
    environment:
      - CLINE_PROXY_HOST=0.0.0.0
      - CLINE_PROXY_DATA_DIR=/app/data
      - CLINE_ADMIN_PASSWORD=${CLINE_ADMIN_PASSWORD:?Set an initial admin password of 8-72 bytes}
