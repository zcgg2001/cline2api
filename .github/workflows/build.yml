name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: cline-proxy-desktop.exe
            ldflags: "-s -w -H windowsgui"
          - runner: macos-latest
            artifact: cline-proxy-desktop-darwin-arm64
            ldflags: "-s -w"
          - runner: ubuntu-22.04
            artifact: cline-proxy-desktop-linux-amd64
            ldflags: "-s -w"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
          # 标签构建使用标签版本；手动构建为空，回退到源码 VERSION。
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          UPDATE_CHANNEL: ${{ github.ref_type == 'tag' && 'release' || 'development' }}
        run: go build -tags "desktop production" -trimpath -ldflags="-s -w -X main.appVersion=${APP_VERSION} -X main.updateRepository=${UPDATE_REPOSITORY} -X main.updateChannel=${UPDATE_CHANNEL} ${{ matrix.ldflags }}" -o ${{ matrix.artifact }} ./cmd/cline-proxy

      - name: Verify selfcheck
        if: runner.os != 'Linux'
        run: ./${{ matrix.artifact }} -selfcheck

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify version release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -f "docs/releases/${RELEASE_TAG}.md"

      - name: Refuse to overwrite an existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Fail closed on API errors; only an explicit 404 permits creation.
          status=$(curl --silent --show-error --output release-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")
          if [[ "$status" != "404" ]]; then
            echo "Release creation refused: tag ${RELEASE_TAG} returned HTTP ${status}. Use a new version; existing Releases are preserved."
            exit 1
          fi

      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            cline-proxy-desktop.exe/cline-proxy-desktop.exe
            cline-proxy-desktop-darwin-arm64/cline-proxy-desktop-darwin-arm64
            cline-proxy-desktop-linux-amd64/cline-proxy-desktop-linux-amd64
