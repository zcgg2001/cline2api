name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -mod=readonly -race -shuffle=on -timeout 120s ./...
      - run: go vet -mod=readonly ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cmd/cline-proxy/web/tests/*.test.cjs
      - run: make check-web
      - run: make build
